<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <div class="left-side">
      <img src="bg.jpg" alt="illustration" width="500" height="500">
    </div>

    <div class="right-side">

      <h1>Get iintoo it today</h1>
      <p class="subtitle">
        There is no charge or obligation upon registration.
      </p>

      <div class="social-buttons">
        <button class="facebook">Register with Facebook</button>
        <button class="Linkedin">Register with Linkedin</button>
      </div>

      <div class="divider">
      </div>

      <form>
        <div class="input-group">
          <input type="email" placeholder="email">
          <input type="text" placeholder="Phone">
        </div>

        <h3>What type of inventor are you?</h3>
        <p class="small-text">
          select the type of inventor you are below.
        </p>

        <div class="radio-group">
          <label>
            <input type="radio" name="investor" checked>
            individual
          </label>

          <label>
            <input type="radio" name="investor">
            Business
          </label>

          <label>
            <input type="radio" name="investor">
            IRA
          </label>

          <label>
            <input type="radio" name="investor>
            Trust
          </label>
        </div>

        <p class="description">
          I am a natural person investing on my own behalf as a solo owner,
          joint tenant, or tenant in common.
        </p>

        <div class="checkbox">
          <input type="checkbox">
          <span>
            i agree to the terms and recieving notifications from iinto
          </span>
        </div>

        <button class="create-btn">
          create Account
        </button>

      </form>

      </div>
    </div>

  
  
</body>
</html>
